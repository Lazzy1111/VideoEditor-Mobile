name: Gerar APK direto para Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK instalável de teste
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Conferir pacote e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" VideoEditor-Mobile-0.2-BETA.apk
      - name: Publicar APK diretamente (sem ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=videoeditor-mobile-v0.2-beta
          APK=VideoEditor-Mobile-0.2-BETA.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title 'VideoEditor Mobile 0.2 BETA — Android' \
              --notes 'APK Android para instalar diretamente, sem ZIP. Esta é uma compilação beta de teste (debug), assinada automaticamente pelo runner. Testes em celular físico ainda são necessários. Se reinstalar um APK assinado com outra chave, talvez seja necessário desinstalar a versão anterior e seus dados locais podem ser perdidos.'
          fi
          echo "### Download direto sem ZIP" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}" >> "$GITHUB_STEP_SUMMARY"
